name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Install Chromium for the E2 probe tests
        run: npx playwright install --with-deps chromium
      - name: Test with coverage thresholds
        run: npm run test:coverage
      - name: Clean-room scan
        run: npm run check:clean-room
      - name: Build the Vercel bundle
        run: npm run build:vercel

  eval-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Detection matrix
        run: node src/eval/cli.ts matrix --json "$RUNNER_TEMP/matrix.json"
      - name: Diff the matrix verdicts against the committed file
        run: diff -u reports/committed/matrix.json "$RUNNER_TEMP/matrix.json"
      - name: Rescore committed games with no key and diff each committed tier report
        run: |
          for tier in sample full; do
            committed="reports/committed/$tier.json"
            if [ ! -f "$committed" ]; then
              echo "no $committed yet; skipping"
              continue
            fi
            node src/eval/cli.ts score --games games --tier "$tier" --json "$RUNNER_TEMP/$tier.json"
            diff -u "$committed" "$RUNNER_TEMP/$tier.json"
          done

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install the engine (the site imports its handlers and reports)
        run: npm ci
      - name: Install the site
        run: npm ci
        working-directory: site
      - name: Typecheck the site
        run: npm run typecheck
        working-directory: site
      - name: Test the site (data copies, engine constants, media contract)
        run: npm test
        working-directory: site
      - name: Diff the site's report copies against the committed reports
        run: |
          for name in full sample matrix; do
            diff -u "reports/committed/$name.json" "site/src/data/$name.json"
          done
      - name: Build the page and the Build Output bundle together
        run: |
          npm run build --prefix site
          npm run build:vercel -- --require-site

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
