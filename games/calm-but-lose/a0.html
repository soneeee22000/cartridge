<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falling Stars</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #fbf7ee;
    overflow: hidden;
    font-family: "Arial Narrow", Arial, sans-serif;
  }
  #wrap {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #clearBtn {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    min-width: 160px;
    height: 52px;
    background: #ff48b0;
    color: #fbf7ee;
    border: 3px solid #5b3a8c;
    border-radius: 10px;
    font-family: "Arial Narrow", Arial, sans-serif;
    font-weight: bold;
    font-size: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    z-index: 10;
    box-shadow: 2px 2px 0 #0078bf;
  }
  #clearBtn:active {
    transform: translateX(-50%) translateY(2px);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
</div>
<button id="clearBtn">Clear Jar</button>

<script>
const CARTRIDGE = {
  send(type, payload = {}) {
    window.parent.postMessage(
      { source: "cartridge", v: 1, type, payload },
      "*",
    );
  },
};
</script>

<script>
(function() {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const clearBtn = document.getElementById("clearBtn");

  let dpr = Math.max(1, window.devicePixelRatio || 1);
  let W = 0, H = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildGrain();
  }

  // grain tile - prerendered once per resize
  let grainCanvas = null;
  function buildGrain() {
    const size = 96;
    grainCanvas = document.createElement("canvas");
    grainCanvas.width = size;
    grainCanvas.height = size;
    const gctx = grainCanvas.getContext("2d");
    const imgData = gctx.createImageData(size, size);
    for (let i = 0; i < imgData.data.length; i += 4) {
      const v = Math.random() * 255;
      imgData.data[i] = v;
      imgData.data[i + 1] = v;
      imgData.data[i + 2] = v;
      imgData.data[i + 3] = 255;
    }
    gctx.putImageData(imgData, 0, 0);
  }

  function drawGrain() {
    if (!grainCanvas) return;
    ctx.save();
    ctx.globalAlpha = 0.08;
    const pattern = ctx.createPattern(grainCanvas, "repeat");
    ctx.fillStyle = pattern;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  window.addEventListener("resize", resize);

  // ---- state ----
  let paused = false;
  let running = false; // has play begun (first tap)
  let tally = 0;

  const INK1 = "#ff48b0";
  const INK2 = "#0078bf";
  const OVERLAP = "#5b3a8c";
  const PAPER = "#fbf7ee";

  // falling stars
  const stars = [];
  const maxStars = 14;
  let spawnTimer = 0;

  // stars collected -> jar particles
  const jarStars = [];

  function rand(a, b) { return a + Math.random() * (b - a); }

  function spawnStar() {
    if (stars.length >= maxStars) return;
    const size = rand(18, 30);
    stars.push({
      x: rand(size, W - size),
      y: -size * 2,
      size,
      speed: rand(40, 90),
      rot: rand(0, Math.PI * 2),
      rotSpeed: rand(-1, 1),
      ink: Math.random() < 0.5 ? INK1 : INK2,
      popped: false,
      popT: 0
    });
  }

  function drawStarShape(cx, cy, r, rot, color, offset) {
    // 5-point star with misregistration offset
    ctx.save();
    ctx.translate(cx + offset, cy + offset);
    ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 === 0 ? r : r * 0.45;
      const ang = (Math.PI / 5) * i - Math.PI / 2;
      const px = Math.cos(ang) * rad;
      const py = Math.sin(ang) * rad;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  function drawStar(s) {
    // second ink offset layer for misregistration effect
    drawStarShape(s.x, s.y, s.size, s.rot, s.ink === INK1 ? INK2 : INK1, 2);
    drawStarShape(s.x, s.y, s.size, s.rot, s.ink, 0);
  }

  function drawJar() {
    const jarW = Math.min(W * 0.5, 260);
    const jarH = jarW * 1.1;
    const jx = W / 2;
    const jy = H - jarH / 2 - 14;

    // jar body (glass outline in ink2, offset ink1 for misregistration)
    ctx.save();
    ctx.translate(jx, jy);

    // shadow/second layer offset
    ctx.strokeStyle = INK1;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-jarW * 0.42 + 2, -jarH * 0.42 + 2);
    ctx.lineTo(-jarW * 0.48 + 2, jarH * 0.46 + 2);
    ctx.quadraticCurveTo(-jarW * 0.48 + 2, jarH * 0.52 + 2, -jarW * 0.3 + 2, jarH * 0.52 + 2);
    ctx.lineTo(jarW * 0.3 + 2, jarH * 0.52 + 2);
    ctx.quadraticCurveTo(jarW * 0.48 + 2, jarH * 0.52 + 2, jarW * 0.48 + 2, jarH * 0.46 + 2);
    ctx.lineTo(jarW * 0.42 + 2, -jarH * 0.42 + 2);
    ctx.stroke();

    // main outline
    ctx.strokeStyle = INK2;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-jarW * 0.42, -jarH * 0.42);
    ctx.lineTo(-jarW * 0.48, jarH * 0.46);
    ctx.quadraticCurveTo(-jarW * 0.48, jarH * 0.52, -jarW * 0.3, jarH * 0.52);
    ctx.lineTo(jarW * 0.3, jarH * 0.52);
    ctx.quadraticCurveTo(jarW * 0.48, jarH * 0.52, jarW * 0.48, jarH * 0.46);
    ctx.lineTo(jarW * 0.42, -jarH * 0.42);
    ctx.stroke();

    // jar neck
    ctx.beginPath();
    ctx.moveTo(-jarW * 0.22, -jarH * 0.42);
    ctx.lineTo(-jarW * 0.22, -jarH * 0.55);
    ctx.lineTo(jarW * 0.22, -jarH * 0.55);
    ctx.lineTo(jarW * 0.22, -jarH * 0.42);
    ctx.stroke();

    // lid
    ctx.fillStyle = INK1;
    ctx.fillRect(-jarW * 0.26, -jarH * 0.62, jarW * 0.52, jarH * 0.08);

    ctx.restore();

    // draw stars inside jar (clip)
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(jx - jarW * 0.46, jy - jarH * 0.4);
    ctx.lineTo(jx - jarW * 0.46, jy + jarH * 0.46);
    ctx.quadraticCurveTo(jx - jarW * 0.46, jy + jarH * 0.5, jx - jarW * 0.3, jy + jarH * 0.5);
    ctx.lineTo(jx + jarW * 0.3, jy + jarH * 0.5);
    ctx.quadraticCurveTo(jx + jarW * 0.46, jy + jarH * 0.5, jx + jarW * 0.46, jy + jarH * 0.46);
    ctx.lineTo(jx + jarW * 0.46, jy - jarH * 0.4);
    ctx.closePath();
    ctx.clip();

    for (const js of jarStars) {
      drawStarShape(jx + js.ox, jy + js.oy, js.size, js.rot, js.ink, 0);
    }
    ctx.restore();

    // glow overlay hint if jar has stars
    if (jarStars.length > 0) {
      ctx.save();
      ctx.globalAlpha = 0.15;
      ctx.fillStyle = OVERLAP;
      ctx.beginPath();
      ctx.arc(jx, jy, jarW * 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function addToJar(size, ink) {
    const jarW = Math.min(W * 0.5, 260);
    const jarH = jarW * 1.1;
    jarStars.push({
      ox: rand(-jarW * 0.32, jarW * 0.32),
      oy: rand(-jarH * 0.15, jarH * 0.42),
      size: size * 0.55,
      rot: rand(0, Math.PI * 2),
      ink
    });
    if (jarStars.length > 60) jarStars.shift();
  }

  function drawTitleScreen() {
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    // decorative floating stars in background
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + performance.now() * 0.0002;
      const cx = W / 2 + Math.cos(a) * W * 0.28;
      const cy = H * 0.32 + Math.sin(a) * H * 0.12;
      drawStarShape(cx, cy, 16, a, i % 2 === 0 ? INK1 : INK2, 1);
    }

    ctx.fillStyle = OVERLAP;
    ctx.font = "bold 44px 'Arial Narrow', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("FALLING STARS", W / 2, H * 0.42);

    const pulse = 0.6 + 0.4 * Math.sin(performance.now() * 0.005);
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.fillStyle = INK2;
    ctx.font = "bold 24px 'Arial Narrow', sans-serif";
    ctx.fillText("Tap to begin", W / 2, H * 0.5);
    ctx.restore();

    drawJar();
    drawGrain();
  }

  function drawHUD() {
    ctx.fillStyle = OVERLAP;
    ctx.font = "bold 28px 'Arial Narrow', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("Stars: " + tally, 16, 40);
  }

  function update(dt) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnStar();
      spawnTimer = rand(0.5, 1.1);
    }
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      if (s.popped) {
        s.popT += dt;
        if (s.popT > 0.25) stars.splice(i, 1);
        continue;
      }
      s.y += s.speed * dt;
      s.rot += s.rotSpeed * dt;
      if (s.y - s.size > H) {
        stars.splice(i, 1);
      }
    }
  }

  function draw() {
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      if (s.popped) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - s.popT / 0.25);
        const scale = 1 + s.popT * 2;
        ctx.translate(s.x, s.y);
        ctx.scale(scale, scale);
        ctx.translate(-s.x, -s.y);
        drawStar(s);
        ctx.restore();
      } else {
        drawStar(s);
      }
    }

    drawJar();
    drawHUD();
    drawGrain();
  }

  function place(star) {
    star.popped = true;
    star.popT = 0;
    tally += 1;
    addToJar(star.size, star.ink);
    CARTRIDGE.send("score", { value: tally });
  }

  function hitTest(x, y) {
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      if (s.popped) continue;
      const dx = x - s.x, dy = y - s.y;
      if (dx * dx + dy * dy <= (s.size * 1.3) * (s.size * 1.3)) {
        return s;
      }
    }
    return null;
  }

  function clearTable() {
    stars.length = 0;
    jarStars.length = 0;
    tally = 0;
    CARTRIDGE.send("score", { value: 0 });
    draw();
  }

  clearBtn.addEventListener("click", clearTable);

  canvas.style.touchAction = "none";
  canvas.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    if (paused) return;
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    if (!running) {
      running = true;
      CARTRIDGE.send("start");
      return;
    }
    const hit = hitTest(x, y);
    if (hit) place(hit);
  });

  window.addEventListener("message", (event) => {
    const data = event.data;
    if (!data || data.source !== "cartridge-host") return;
    if (data.type === "pause") paused = true;
    if (data.type === "resume") paused = false;
    if (data.type === "reset") {
      running = false;
      clearTable();
    }
  });

  let lastTime = null;
  function frame(t) {
    if (lastTime === null) lastTime = t;
    const dt = Math.min(0.05, (t - lastTime) / 1000);
    lastTime = t;

    if (!paused) {
      if (running) {
        update(dt);
        draw();
      } else {
        drawTitleScreen();
      }
    }
    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener("resize", resize);

  // initial boot after first frame drawn
  draw();
  CARTRIDGE.send("boot", { title: "Falling Stars", gameType: "toy-box", lang: "en" });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
