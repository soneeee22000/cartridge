<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canal Lanterns</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #fbf7ee;
    overflow: hidden;
    touch-action: none;
    font-family: 'Arial Narrow', Arial, sans-serif;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #fbf7ee;
  }
  canvas {
    display: block;
    touch-action: none;
    background: #fbf7ee;
  }
  #hint {
    position: absolute;
    pointer-events: none;
    color: #0078bf;
    font-weight: 900;
    letter-spacing: 1px;
    text-shadow: 1px 1px 0 #ff48b0;
  }
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
</div>
<script>
// ---- Bridge helper (verbatim) ----
const CARTRIDGE = {
  send(type, payload = {}) {
    window.parent.postMessage(
      { source: "cartridge", v: 1, type, payload },
      "*",
    );
  },
};
</script>
<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ---------- sizing ----------
  let W = 0, H = 0, DPR = 1;
  function resize(){
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildGrain();
  }
  window.addEventListener('resize', resize);

  // ---------- grain tile (pre-rendered once) ----------
  let grainCanvas = null;
  function buildGrain(){
    const size = 128;
    grainCanvas = document.createElement('canvas');
    grainCanvas.width = size;
    grainCanvas.height = size;
    const gctx = grainCanvas.getContext('2d');
    const imgData = gctx.createImageData(size, size);
    for (let i = 0; i < imgData.data.length; i += 4) {
      const v = Math.random() * 255;
      imgData.data[i] = v;
      imgData.data[i+1] = v;
      imgData.data[i+2] = v;
      imgData.data[i+3] = 255;
    }
    gctx.putImageData(imgData, 0, 0);
  }

  function drawGrain(){
    if (!grainCanvas) return;
    ctx.save();
    ctx.globalAlpha = 0.08;
    const pat = ctx.createPattern(grainCanvas, 'repeat');
    ctx.fillStyle = pat;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // ---------- palette ----------
  const PAPER = '#fbf7ee';
  const INK1 = '#ff48b0';
  const INK2 = '#0078bf';
  const OVER = '#5b3a8c';

  // ---------- game state ----------
  const LANES = 3;
  let laneX = [];
  function computeLanes(){
    const margin = W * 0.18;
    const usable = W - margin * 2;
    laneX = [];
    for (let i = 0; i < LANES; i++){
      laneX.push(margin + usable * (i + 0.5) / LANES);
    }
  }

  let last = 0;
  let running = false; // is a run in progress (post-start, pre-end)
  let started = false; // has start ever been sent for this run
  let paused = false;
  let score = 0;
  let scoreShown = -1;
  let gameTime = 0;
  let speed = 220; // px/sec scroll speed
  let boat = { x: 0, y: 0, targetX: 0, lane: 1, w: 0, h: 0 };
  let obstacles = [];
  let lanterns = [];
  let spawnTimer = 0;
  let lanternTimer = 0;
  let idleTimer = 0;
  let hasMoved = false;
  let bootSent = false;
  let firstFrameDrawn = false;
  let endSent = false;

  function toCanvas(evt){
    const rect = canvas.getBoundingClientRect();
    return {
      x: (evt.clientX - rect.left),
      y: (evt.clientY - rect.top)
    };
  }

  function resetState(){
    score = 0;
    scoreShown = -1;
    gameTime = 0;
    speed = 220;
    obstacles = [];
    lanterns = [];
    spawnTimer = 1.4; // fairness: first hazard well ahead
    lanternTimer = 0.8;
    idleTimer = 0;
    hasMoved = false;
    endSent = false;
    computeLanes();
    boat.lane = 1;
    boat.x = laneX[1];
    boat.targetX = laneX[1];
    boat.y = H * 0.78;
    boat.w = Math.min(W, H) * 0.09;
    boat.h = boat.w * 2.0;
  }

  function backToTitle(){
    running = false;
    started = false;
    paused = false;
    resetState();
  }

  function startRun(){
    if (running) return;
    resetState();
    running = true;
    started = true;
    CARTRIDGE.send('start', {});
  }

  // ---------- input ----------
  let held = false;
  canvas.addEventListener('pointerdown', (event) => {
    if (!started){
      startRun();
    }
    held = true;
    hasMoved = true;
    idleTimer = 0;
    try { canvas.setPointerCapture(event.pointerId); } catch(e){}
    const p = toCanvas(event);
    boat.targetX = clamp(p.x, boat.w, W - boat.w);
  });
  canvas.addEventListener('pointermove', (event) => {
    if (!held) return;
    hasMoved = true;
    idleTimer = 0;
    const p = toCanvas(event);
    boat.targetX = clamp(p.x, boat.w, W - boat.w);
  });
  function releasePointer(){ held = false; }
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);

  function clamp(v, lo, hi){
    return Math.max(lo, Math.min(hi, v));
  }

  // ---------- spawning ----------
  function spawnObstacle(){
    // pick 1 or 2 lanes blocked, leave at least one open
    const type = Math.random();
    const blockedCount = Math.random() < 0.6 ? 1 : 2;
    const lanesArr = [0,1,2];
    for (let i = lanesArr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [lanesArr[i], lanesArr[j]] = [lanesArr[j], lanesArr[i]];
    }
    const blocked = lanesArr.slice(0, blockedCount);
    const kind = type < 0.5 ? 'barge' : (type < 0.8 ? 'bridge' : 'crate');
    for (const laneIdx of blocked){
      obstacles.push({
        lane: laneIdx,
        x: laneX[laneIdx],
        y: -100,
        w: Math.min(W,H) * (kind === 'bridge' ? 0.24 : 0.16),
        h: Math.min(W,H) * (kind === 'bridge' ? 0.14 : 0.12),
        kind: kind,
        passed: false
      });
    }
  }

  function spawnLantern(){
    const laneIdx = Math.floor(Math.random() * LANES);
    lanterns.push({
      lane: laneIdx,
      x: laneX[laneIdx],
      y: -60,
      r: Math.min(W,H) * 0.035,
      taken: false
    });
  }

  // ---------- update ----------
  function advance(dt){
    gameTime += dt;
    idleTimer += dt;
    speed += dt * 4.2; // ramp difficulty via speed

    // ease boat towards target
    boat.x += (boat.targetX - boat.x) * Math.min(1, dt * 10);

    // spawn timers
    spawnTimer -= dt;
    if (spawnTimer <= 0){
      spawnObstacle();
      spawnTimer = Math.max(0.55, 1.5 - gameTime * 0.01);
    }
    lanternTimer -= dt;
    if (lanternTimer <= 0){
      spawnLantern();
      lanternTimer = 0.9 + Math.random() * 0.9;
    }

    for (const o of obstacles){
      o.y += speed * dt;
    }
    obstacles = obstacles.filter(o => o.y < H + 150);

    for (const l of lanterns){
      l.y += speed * dt;
    }
    lanterns = lanterns.filter(l => l.y < H + 80 && !l.taken);
  }

  function collide(){
    for (const o of obstacles){
      const dx = Math.abs(o.x - boat.x);
      const dy = Math.abs(o.y - boat.y);
      if (dx < (o.w + boat.w) * 0.42 && dy < (o.h + boat.h) * 0.38){
        crash();
        return;
      }
    }
    for (const l of lanterns){
      if (l.taken) continue;
      const dx = l.x - boat.x;
      const dy = l.y - boat.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < l.r + boat.w * 0.5){
        l.taken = true;
        score += 10;
        CARTRIDGE.send('score', { value: score });
      }
    }
  }

  function crash(){
    if (endSent) return;
    running = false;
    endSent = true;
    CARTRIDGE.send('end', { reason: 'lose', value: score });
  }

  // ---------- drawing ----------
  function drawWater(){
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    // canal channels (ink2 flat, offset stripes for misregistration)
    const margin = W * 0.18;
    const usable = W - margin * 2;
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = INK2;
    ctx.fillRect(margin, 0, usable, H);
    ctx.restore();

    // lane divider lines with misregistration offset
    ctx.strokeStyle = INK2;
    ctx.lineWidth = 3;
    ctx.setLineDash([18, 14]);
    const scrollOffset = (gameTime * speed) % 32;
    for (let i = 1; i < LANES; i++){
      const x = margin + usable * i / LANES;
      ctx.save();
      ctx.translate(1, 1);
      ctx.strokeStyle = INK1;
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.moveTo(x, -scrollOffset);
      ctx.lineTo(x, H);
      ctx.stroke();
      ctx.restore();

      ctx.beginPath();
      ctx.moveTo(x, -scrollOffset);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // canal edges
    ctx.fillStyle = INK1;
    ctx.fillRect(0, 0, margin, H);
    ctx.fillRect(W - margin, 0, margin, H);
  }

  function drawHalftoneCircle(x, y, r, color){
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawBoat(){
    const x = boat.x, y = boat.y, w = boat.w, h = boat.h;
    // shadow ink2 offset
    ctx.save();
    ctx.translate(2, 2);
    ctx.fillStyle = INK2;
    ctx.globalAlpha = 0.55;
    drawHullPath(x, y, w, h);
    ctx.fill();
    ctx.restore();

    // main hull ink1
    ctx.fillStyle = INK1;
    drawHullPath(x, y, w, h);
    ctx.fill();

    // cabin (overlap color)
    ctx.fillStyle = OVER;
    ctx.fillRect(x - w*0.28, y - h*0.12, w*0.56, h*0.28);
  }

  function drawHullPath(x, y, w, h){
    ctx.beginPath();
    ctx.moveTo(x - w*0.5, y - h*0.3);
    ctx.lineTo(x + w*0.5, y - h*0.3);
    ctx.lineTo(x + w*0.4, y + h*0.45);
    ctx.quadraticCurveTo(x, y + h*0.65, x - w*0.4, y + h*0.45);
    ctx.closePath();
  }

  function drawObstacle(o){
    ctx.save();
    ctx.translate(1, 1);
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = INK2;
    obstacleShape(o);
    ctx.restore();

    ctx.fillStyle = o.kind === 'bridge' ? OVER : INK2;
    obstacleShape(o);
  }

  function obstacleShape(o){
    ctx.beginPath();
    if (o.kind === 'bridge'){
      ctx.fillRect(o.x - o.w/2, o.y - o.h/2, o.w, o.h);
    } else if (o.kind === 'barge'){
      ctx.fillRect(o.x - o.w/2, o.y - o.h/2, o.w, o.h*0.8);
    } else {
      // crate: rotated square
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(Math.PI/4);
      ctx.fillRect(-o.w/2.6, -o.w/2.6, o.w/1.3, o.w/1.3);
      ctx.restore();
      return;
    }
  }

  function drawLantern(l){
    // glow ink1 offset
    ctx.save();
    ctx.translate(1, -1);
    ctx.globalAlpha = 0.5;
    drawHalftoneCircle(l.x, l.y, l.r, INK1);
    ctx.restore();

    drawHalftoneCircle(l.x, l.y, l.r, INK1);
    ctx.fillStyle = OVER;
    ctx.fillRect(l.x - l.r*0.15, l.y - l.r*1.4, l.r*0.3, l.r*0.6);
  }

  function drawHUD(){
    ctx.fillStyle = INK2;
    ctx.font = '900 ' + Math.round(Math.min(W,H)*0.055) + 'px Arial Narrow, Arial, sans-serif';
    ctx.textBaseline = 'top';
    ctx.save();
    ctx.translate(1,1);
    ctx.fillStyle = INK1;
    ctx.fillText('LANTERNS ' + score, 16, 14);
    ctx.restore();
    ctx.fillStyle = INK2;
    ctx.fillText('LANTERNS ' + score, 16, 14);
  }

  function drawTitle(){
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    drawWater();

    const t = gameTime;
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = INK1;
    ctx.font = '900 ' + Math.round(Math.min(W,H)*0.09) + 'px Arial Narrow, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.save();
    ctx.translate(2,2);
    ctx.fillStyle = INK2;
    ctx.fillText('CANAL LANTERNS', W/2, H*0.28);
    ctx.restore();
    ctx.fillStyle = INK1;
    ctx.fillText('CANAL LANTERNS', W/2, H*0.28);
    ctx.restore();

    const pulse = 0.6 + 0.4 * Math.sin(t * 3);
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.fillStyle = OVER;
    ctx.font = '700 ' + Math.round(Math.min(W,H)*0.04) + 'px Arial Narrow, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('DRAG TO STEER YOUR BOAT', W/2, H*0.42);
    ctx.fillText('TAP OR DRAG TO BEGIN', W/2, H*0.48);
    ctx.restore();

    // idle floating boat preview
    boat.x = laneX[1] + Math.sin(t * 1.5) * W * 0.08;
    boat.y = H * 0.7;
    drawBoat();

    ctx.textAlign = 'left';
  }

  function drawGameOver(){
    ctx.save();
    ctx.fillStyle = PAPER;
    ctx.globalAlpha = 0.85;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    ctx.textAlign = 'center';
    ctx.save();
    ctx.translate(2,2);
    ctx.fillStyle = INK2;
    ctx.font = '900 ' + Math.round(Math.min(W,H)*0.08) + 'px Arial Narrow, Arial, sans-serif';
    ctx.fillText('CAPSIZED', W/2, H*0.36);
    ctx.restore();
    ctx.fillStyle = INK1;
    ctx.fillText('CAPSIZED', W/2, H*0.36);

    ctx.font = '700 ' + Math.round(Math.min(W,H)*0.045) + 'px Arial Narrow, Arial, sans-serif';
    ctx.fillStyle = OVER;
    ctx.fillText('LANTERNS COLLECTED: ' + score, W/2, H*0.46);
    ctx.fillText('TAP TO SAIL AGAIN', W/2, H*0.54);
    ctx.textAlign = 'left';
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    if (!started){
      drawTitle();
    } else if (running){
      drawWater();
      for (const l of lanterns) drawLantern(l);
      for (const o of obstacles) drawObstacle(o);
      drawBoat();
      drawHUD();
    } else {
      drawWater();
      for (const l of lanterns) drawLantern(l);
      for (const o of obstacles) drawObstacle(o);
      drawBoat();
      drawHUD();
      drawGameOver();
    }
    drawGrain();
    if (!firstFrameDrawn){
      firstFrameDrawn = true;
      if (!bootSent){
        bootSent = true;
        CARTRIDGE.send('boot', { title: 'Canal Lanterns', gameType: 'arcade-run', lang: 'en' });
      }
    }
  }

  // restart on tap after game over
  canvas.addEventListener('pointerdown', (event) => {
    if (started && !running){
      // after game over, restart
      startRun();
    }
  });

  // ---------- loop ----------
  function frame(now){
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (running && !paused){
      advance(dt || 0);
      collide();
    }
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- host messages ----------
  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || data.source !== 'cartridge-host') return;
    if (data.type === 'pause') paused = true;
    if (data.type === 'resume') paused = false;
    if (data.type === 'reset') backToTitle();
  });

  // ---------- init ----------
  resize();
  resetState();
  requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
