<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Gardien du Phare</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #f4ecd8;
    overflow: hidden;
    touch-action: none;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  #wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
</div>
<script>
const CARTRIDGE = {
  send(type, payload = {}) {
    window.parent.postMessage(
      { source: "cartridge", v: 1, type, payload },
      "*",
    );
  },
};
</script>
<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let DPR = Math.max(1, window.devicePixelRatio || 1);
  let W = 0, H = 0;

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- palette ----------
  const COL_BG = '#f4ecd8';
  const COL_LAYER = '#e07a5f';
  const COL_ACCENT = '#3d405b';
  const COL_HILITE = '#81b29a';

  // ---------- seeded jitter helper ----------
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const jitterRand = mulberry32(1337);
  function jitterPoint(x, y, seedOffset){
    const r1 = mulberry32(1337 + seedOffset * 2)();
    const r2 = mulberry32(1337 + seedOffset * 2 + 1)();
    return [x + (r1 - 0.5) * 3, y + (r2 - 0.5) * 3];
  }

  function paperPolygon(ctx, pts, fill, seedBase){
    ctx.save();
    ctx.shadowColor = 'rgba(61,64,91,0.35)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 3;
    ctx.beginPath();
    pts.forEach((p, i) => {
      const [jx, jy] = jitterPoint(p[0], p[1], seedBase + i);
      if (i === 0) ctx.moveTo(jx, jy);
      else ctx.lineTo(jx, jy);
    });
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.restore();
  }

  function paperRoundRect(ctx, x, y, w, h, r, fill, seedBase){
    ctx.save();
    ctx.shadowColor = 'rgba(61,64,91,0.35)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 3;
    const [jx, jy] = jitterPoint(x, y, seedBase);
    ctx.beginPath();
    ctx.moveTo(jx + r, jy);
    ctx.arcTo(jx + w, jy, jx + w, jy + h, r);
    ctx.arcTo(jx + w, jy + h, jx, jy + h, r);
    ctx.arcTo(jx, jy + h, jx, jy, r);
    ctx.arcTo(jx, jy, jx + w, jy, r);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.restore();
  }

  function paperCircle(ctx, cx, cy, r, fill, seedBase){
    ctx.save();
    ctx.shadowColor = 'rgba(61,64,91,0.35)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 3;
    const [jx, jy] = jitterPoint(cx, cy, seedBase);
    ctx.beginPath();
    ctx.arc(jx, jy, r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.restore();
  }

  // ---------- game state ----------
  const STATE = { TITLE: 'title', PLAYING: 'playing', STAGE_CLEAR: 'stage_clear', END: 'end' };
  let state = STATE.TITLE;
  let paused = false;

  let stage = 0;
  const STAGES = [
    { boats: 3, speed: 0.10, spawnGap: 3.2, goalText: "Sauvez 3 bateaux" },
    { boats: 4, speed: 0.13, spawnGap: 2.8, goalText: "Sauvez 4 bateaux" },
    { boats: 5, speed: 0.16, spawnGap: 2.4, goalText: "Sauvez 5 bateaux" },
    { boats: 6, speed: 0.19, spawnGap: 2.0, goalText: "Sauvez 6 bateaux" },
    { boats: 7, speed: 0.22, spawnGap: 1.8, goalText: "Sauvez 7 bateaux" },
  ];

  let score = 0;
  let beamAngle = 0; // radians
  let boats = [];
  let spawned = 0;
  let saved = 0;
  let spawnTimer = 0;
  let graceTimer = 0;
  let stageMsgTimer = 0;
  let endReason = null;
  let lastTime = null;
  let held = null; // pointer drag state
  let towerCenter = { x: 0, y: 0 };
  let towerRadius = 40;

  function toCanvas(evt){
    const rect = canvas.getBoundingClientRect();
    return {
      x: (evt.clientX - rect.left),
      y: (evt.clientY - rect.top)
    };
  }

  function backToTitle(){
    state = STATE.TITLE;
    paused = false;
    stage = 0;
    score = 0;
    boats = [];
    held = null;
  }

  function enterStage(next){
    stage = next;
    boats = [];
    spawned = 0;
    saved = 0;
    spawnTimer = 0;
    graceTimer = 2.5; // grace period
    stageMsgTimer = 2.5;
    state = STATE.PLAYING;
    CARTRIDGE.send("level", { index: stage });
  }

  function onGoalMet(){
    if (stage === STAGES.length){
      endReason = 'win';
      state = STATE.END;
      CARTRIDGE.send("end", { reason: "win", value: score });
    } else {
      state = STATE.STAGE_CLEAR;
      stageMsgTimer = 1.8;
    }
  }

  function onStageFailed(){
    endReason = 'lose';
    state = STATE.END;
    CARTRIDGE.send("end", { reason: "lose", value: score });
  }

  function startGame(){
    score = 0;
    CARTRIDGE.send("start");
    CARTRIDGE.send("score", { value: score });
    enterStage(1);
  }

  // ---------- boats ----------
  function spawnBoat(cfg){
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.min(W, H) * 0.55;
    boats.push({
      angle: angle,
      dist: dist,
      speed: cfg.speed * (0.85 + Math.random() * 0.3),
      lit: false,
      wobble: Math.random() * Math.PI * 2,
      id: Math.random()
    });
  }

  function updateBoats(dt, cfg){
    for (let i = boats.length - 1; i >= 0; i--){
      const b = boats[i];
      b.wobble += dt * 2;
      // Check if lit by beam
      let diff = Math.abs(((b.angle - beamAngle + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
      const beamHalfWidth = 0.28;
      b.lit = diff < beamHalfWidth;

      if (b.lit){
        // pushed back to safety, then removed (saved)
        b.dist += dt * 60;
        if (b.dist > Math.min(W, H) * 0.62){
          boats.splice(i, 1);
          saved++;
          score += 10;
          CARTRIDGE.send("score", { value: score });
          if (saved >= cfg.boats && spawned >= cfg.boats){
            onGoalMet();
            return;
          }
        }
      } else {
        b.dist -= b.speed * dt * 60;
        if (b.dist <= towerRadius + 18){
          onStageFailed();
          return;
        }
      }
    }
  }

  // ---------- input: rotate beam by dragging around tower ----------
  canvas.addEventListener('pointerdown', (event) => {
    if (state === STATE.TITLE){
      startGame();
      return;
    }
    if (state === STATE.END){
      backToTitle();
      return;
    }
    if (state !== STATE.PLAYING) return;
    const p = toCanvas(event);
    held = { pointerId: event.pointerId };
    canvas.setPointerCapture(event.pointerId);
    updateBeamFromPoint(p);
  });
  canvas.addEventListener('pointermove', (event) => {
    if (!held) return;
    const p = toCanvas(event);
    updateBeamFromPoint(p);
  });
  function endHold(){ held = null; }
  canvas.addEventListener('pointerup', endHold);
  canvas.addEventListener('pointercancel', endHold);

  function updateBeamFromPoint(p){
    const dx = p.x - towerCenter.x;
    const dy = p.y - towerCenter.y;
    beamAngle = Math.atan2(dy, dx);
  }

  // ---------- host messages ----------
  window.addEventListener("message", (event) => {
    const data = event.data;
    if (!data || data.source !== "cartridge-host") return;
    if (data.type === "pause") paused = true;
    if (data.type === "resume") paused = false;
    if (data.type === "reset") backToTitle();
  });

  // ---------- drawing ----------
  function drawBackground(){
    ctx.fillStyle = COL_BG;
    ctx.fillRect(0, 0, W, H);
    // sea layer (rocks ring)
    const cx = towerCenter.x, cy = towerCenter.y;
    const seaR = Math.min(W, H) * 0.62;
    paperCircle(ctx, cx, cy, seaR, '#cfe3da', 500);
    // rocks ring near tower
    const rockR = towerRadius + 14;
    ctx.save();
    for (let i = 0; i < 14; i++){
      const a = (i / 14) * Math.PI * 2;
      const rx = cx + Math.cos(a) * rockR;
      const ry = cy + Math.sin(a) * rockR;
      paperCircle(ctx, rx, ry, 7, COL_ACCENT, 600 + i);
    }
    ctx.restore();
  }

  function drawBeam(){
    const cx = towerCenter.x, cy = towerCenter.y;
    const len = Math.min(W, H) * 0.62;
    const halfWidth = 0.28;
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, len, beamAngle - halfWidth, beamAngle + halfWidth);
    ctx.closePath();
    ctx.fillStyle = COL_HILITE;
    ctx.fill();
    ctx.restore();
  }

  function drawTower(){
    const cx = towerCenter.x, cy = towerCenter.y;
    // base
    paperRoundRect(ctx, cx - towerRadius, cy - towerRadius, towerRadius * 2, towerRadius * 2, 12, COL_LAYER, 10);
    // stripes
    paperRoundRect(ctx, cx - towerRadius * 0.6, cy - towerRadius * 0.9, towerRadius * 1.2, towerRadius * 0.4, 6, COL_ACCENT, 20);
    // lamp room
    paperCircle(ctx, cx, cy, towerRadius * 0.42, COL_HILITE, 30);
    // small light dot pointing beam direction
    const lx = cx + Math.cos(beamAngle) * towerRadius * 0.6;
    const ly = cy + Math.sin(beamAngle) * towerRadius * 0.6;
    paperCircle(ctx, lx, ly, 6, COL_ACCENT, 40);
  }

  function drawBoat(b){
    const cx = towerCenter.x + Math.cos(b.angle) * b.dist;
    const cy = towerCenter.y + Math.sin(b.angle) * b.dist;
    const wob = Math.sin(b.wobble) * 3;
    const col = b.lit ? COL_HILITE : COL_LAYER;
    ctx.save();
    ctx.translate(cx, cy + wob);
    const hullPts = [
      [-16, 6], [16, 6], [11, 14], [-11, 14]
    ];
    paperPolygon(ctx, hullPts, col, Math.floor(b.id * 1000));
    // sail
    const sailPts = [
      [0, 6], [0, -20], [13, 5]
    ];
    paperPolygon(ctx, sailPts, COL_ACCENT, Math.floor(b.id * 1000) + 5);
    ctx.restore();
  }

  function drawTitle(){
    drawBackground();
    drawTower();
    // title card
    const cardW = Math.min(W * 0.86, 480);
    const cardH = 260;
    const cx = W / 2 - cardW / 2;
    const cy = H / 2 - cardH / 2;
    paperRoundRect(ctx, cx, cy, cardW, cardH, 18, '#fffaf0', 900);
    ctx.fillStyle = COL_ACCENT;
    ctx.textAlign = 'center';
    ctx.font = 'bold 30px sans-serif';
    ctx.fillText('Le Gardien du Phare', W / 2, cy + 60);
    ctx.font = '16px sans-serif';
    wrapText(ctx, "Glissez autour de la tour pour tourner le faisceau et sauver les bateaux des rochers.", W / 2, cy + 100, cardW - 60, 22);
    ctx.font = 'bold 20px sans-serif';
    ctx.fillStyle = COL_LAYER;
    ctx.fillText('Touchez pour commencer', W / 2, cy + cardH - 40);
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight){
    const words = text.split(' ');
    let line = '';
    let yy = y;
    for (let n = 0; n < words.length; n++){
      const testLine = line + words[n] + ' ';
      const metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && n > 0){
        ctx.fillText(line, x, yy);
        line = words[n] + ' ';
        yy += lineHeight;
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line, x, yy);
  }

  function drawHUD(){
    // score plate
    paperRoundRect(ctx, 12, 12, 150, 44, 10, '#fffaf0', 950);
    ctx.fillStyle = COL_ACCENT;
    ctx.textAlign = 'left';
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText('Score: ' + score, 24, 40);

    // stage plate
    const cfg = STAGES[stage - 1];
    if (cfg){
      const plateW = Math.min(W * 0.7, 320);
      paperRoundRect(ctx, W / 2 - plateW / 2, 12, plateW, 44, 10, '#fffaf0', 960);
      ctx.fillStyle = COL_ACCENT;
      ctx.textAlign = 'center';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('Étape ' + stage + ': ' + saved + '/' + cfg.boats + ' sauvés', W / 2, 40);
    }

    if (stageMsgTimer > 0 && cfg){
      const cardW = Math.min(W * 0.8, 420);
      const cardH = 90;
      const cx = W / 2 - cardW / 2;
      const cy = H * 0.28;
      paperRoundRect(ctx, cx, cy, cardW, cardH, 16, '#fffaf0', 970);
      ctx.fillStyle = COL_ACCENT;
      ctx.textAlign = 'center';
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText('Étape ' + stage, W / 2, cy + 35);
      ctx.font = '16px sans-serif';
      ctx.fillText(cfg.goalText, W / 2, cy + 65);
    }
  }

  function drawStageClearOverlay(){
    const cardW = Math.min(W * 0.8, 420);
    const cardH = 140;
    const cx = W / 2 - cardW / 2;
    const cy = H / 2 - cardH / 2;
    paperRoundRect(ctx, cx, cy, cardW, cardH, 16, '#fffaf0', 980);
    ctx.fillStyle = COL_ACCENT;
    ctx.textAlign = 'center';
    ctx.font = 'bold 26px sans-serif';
    ctx.fillText('Étape ' + stage + ' réussie !', W / 2, cy + 55);
    ctx.font = '16px sans-serif';
    ctx.fillText('Préparez-vous pour la suite...', W / 2, cy + 90);
  }

  function drawEndOverlay(){
    const cardW = Math.min(W * 0.8, 440);
    const cardH = 200;
    const cx = W / 2 - cardW / 2;
    const cy = H / 2 - cardH / 2;
    paperRoundRect(ctx, cx, cy, cardW, cardH, 18, '#fffaf0', 990);
    ctx.fillStyle = COL_ACCENT;
    ctx.textAlign = 'center';
    ctx.font = 'bold 28px sans-serif';
    if (endReason === 'win'){
      ctx.fillText('Toutes les nuits sont sauvées !', W / 2, cy + 60);
    } else {
      ctx.fillText('Un bateau a coulé...', W / 2, cy + 60);
    }
    ctx.font = '18px sans-serif';
    ctx.fillText('Score final: ' + score, W / 2, cy + 100);
    ctx.font = 'bold 18px sans-serif';
    ctx.fillStyle = COL_LAYER;
    ctx.fillText('Touchez pour recommencer', W / 2, cy + cardH - 30);
  }

  // ---------- main loop ----------
  function step(ts){
    requestAnimationFrame(step);
    if (lastTime === null) lastTime = ts;
    let dt = (ts - lastTime) / 1000;
    lastTime = ts;
    if (dt > 0.05) dt = 0.05;

    towerCenter.x = W / 2;
    towerCenter.y = H / 2;
    towerRadius = Math.max(36, Math.min(W, H) * 0.07);

    if (paused){
      render();
      return;
    }

    if (state === STATE.PLAYING){
      const cfg = STAGES[stage - 1];
      if (graceTimer > 0) graceTimer -= dt;
      if (stageMsgTimer > 0) stageMsgTimer -= dt;

      spawnTimer -= dt;
      if (graceTimer <= 0 && spawnTimer <= 0 && spawned < cfg.boats){
        spawnBoat(cfg);
        spawned++;
        spawnTimer = cfg.spawnGap;
      }
      if (graceTimer <= 0){
        updateBoats(dt, cfg);
      } else {
        // still allow gentle wobble during grace
        boats.forEach(b => b.wobble += dt * 2);
      }
    } else if (state === STATE.STAGE_CLEAR){
      stageMsgTimer -= dt;
      if (stageMsgTimer <= 0){
        enterStage(stage + 1);
      }
    }

    render();
  }

  function render(){
    ctx.clearRect(0, 0, W, H);
    if (state === STATE.TITLE){
      drawTitle();
    } else if (state === STATE.PLAYING){
      drawBackground();
      drawBeam();
      boats.forEach(drawBoat);
      drawTower();
      drawHUD();
    } else if (state === STATE.STAGE_CLEAR){
      drawBackground();
      boats.forEach(drawBoat);
      drawTower();
      drawHUD();
      drawStageClearOverlay();
    } else if (state === STATE.END){
      drawBackground();
      boats.forEach(drawBoat);
      drawTower();
      drawHUD();
      drawEndOverlay();
    }
    if (paused){
      ctx.save();
      ctx.fillStyle = 'rgba(61,64,91,0.5)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fffaf0';
      ctx.textAlign = 'center';
      ctx.font = 'bold 28px sans-serif';
      ctx.fillText('Pause', W / 2, H / 2);
      ctx.restore();
    }
  }

  // ---------- boot ----------
  towerCenter.x = W / 2;
  towerCenter.y = H / 2;
  requestAnimationFrame((ts) => {
    lastTime = ts;
    render();
    CARTRIDGE.send("boot", { title: "Le Gardien du Phare", gameType: "stage-clear", lang: "fr" });
    requestAnimationFrame(step);
  });
})();
</script>
</body>
</html>
