<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Gardien du Phare</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #fbf7ee; overflow: hidden;
    touch-action: none;
    font-family: 'Arial Narrow', Arial, sans-serif;
  }
  #wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
</div>
<script>
// ---- Bridge helper (verbatim) ----
const CARTRIDGE = {
  send(type, payload = {}) {
    window.parent.postMessage(
      { source: "cartridge", v: 1, type, payload },
      "*",
    );
  },
};
</script>
<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const PAPER = '#fbf7ee';
  const INK1 = '#ff48b0';
  const INK2 = '#0078bf';
  const OVER = '#5b3a8c';

  let DPR = Math.max(1, window.devicePixelRatio || 1);
  let W = 0, H = 0;

  function resize() {
    DPR = Math.max(1, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildGrainTile();
  }

  // ---- Grain tile (pre-rendered noise) ----
  let grainCanvas = document.createElement('canvas');
  let grainCtx = grainCanvas.getContext('2d');
  function buildGrainTile() {
    const size = 128;
    grainCanvas.width = size;
    grainCanvas.height = size;
    const imgData = grainCtx.createImageData(size, size);
    for (let i = 0; i < imgData.data.length; i += 4) {
      const v = Math.random() * 255;
      imgData.data[i] = v;
      imgData.data[i+1] = v;
      imgData.data[i+2] = v;
      imgData.data[i+3] = 255;
    }
    grainCtx.putImageData(imgData, 0, 0);
  }
  let grainPattern = null;

  function drawGrain() {
    if (!grainPattern) {
      grainPattern = ctx.createPattern(grainCanvas, 'repeat');
    }
    ctx.save();
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = grainPattern;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // ---- Game state ----
  let paused = false;
  let screen = 'title'; // title, playing, stageclear, win, lose
  let stage = 0;
  let score = 0;
  let started = false;

  const STAGES = [
    { boats: 2, speed: 0.10, needLight: 1.6, rockDelay: 5.0 },
    { boats: 3, speed: 0.13, needLight: 1.8, rockDelay: 4.5 },
    { boats: 4, speed: 0.16, needLight: 2.0, rockDelay: 4.0 },
    { boats: 5, speed: 0.19, needLight: 2.2, rockDelay: 3.6 },
    { boats: 6, speed: 0.22, needLight: 2.4, rockDelay: 3.2 }
  ];

  let cx = 0, cy = 0; // lighthouse center
  let beamAngle = 0; // radians
  let targetAngle = 0;
  let beamWidth = 0.32; // radians half-angle-ish (full spread)
  let beamLength = 0;

  let boats = [];
  let stageGoalTimer = 0; // grace period
  let graceSeconds = 3;
  let stageStartMsg = '';
  let stageStartMsgTimer = 0;

  let held = false;

  function toCanvas(evt) {
    const rect = canvas.getBoundingClientRect();
    const x = (evt.clientX - rect.left);
    const y = (evt.clientY - rect.top);
    return { x, y };
  }

  function angleFromPoint(p) {
    return Math.atan2(p.y - cy, p.x - cx);
  }

  canvas.addEventListener('pointerdown', (event) => {
    if (screen !== 'playing') return;
    held = true;
    canvas.setPointerCapture(event.pointerId);
    targetAngle = angleFromPoint(toCanvas(event));
  });
  canvas.addEventListener('pointermove', (event) => {
    if (!held) return;
    targetAngle = angleFromPoint(toCanvas(event));
  });
  canvas.addEventListener('pointerup', () => { held = false; });
  canvas.addEventListener('pointercancel', () => { held = false; });

  // click on title / end screens to advance
  canvas.addEventListener('pointerdown', (event) => {
    if (screen === 'title') {
      beginPlay();
    } else if (screen === 'win' || screen === 'lose') {
      backToTitle();
    }
  }, true);

  function shortestAngleDiff(a, b) {
    let d = (b - a) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  function buildStage(n) {
    const cfg = STAGES[n - 1];
    boats = [];
    for (let i = 0; i < cfg.boats; i++) {
      spawnBoat(cfg, i);
    }
    stageGoalTimer = graceSeconds;
    stageStartMsg = 'Phase ' + n + ' — Faites rentrer ' + cfg.boats + ' bateaux';
    stageStartMsgTimer = 3.2;
  }

  function spawnBoat(cfg, idx) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.max(W, H) * 0.62 + Math.random() * 40;
    const x = cx + Math.cos(angle) * dist;
    const y = cy + Math.sin(angle) * dist;
    boats.push({
      x, y,
      angle: angle,
      speed: cfg.speed * (0.85 + Math.random() * 0.3),
      lit: 0,
      needLight: cfg.needLight,
      rockDelay: cfg.rockDelay,
      dangerTimer: 0,
      safe: false,
      dead: false,
      bob: Math.random() * Math.PI * 2
    });
  }

  function enterStage(next) {
    stage = next;
    buildStage(stage);
    CARTRIDGE.send('level', { index: stage });
    screen = 'playing';
  }

  function onGoalMet() {
    if (stage === STAGES.length) {
      screen = 'win';
      CARTRIDGE.send('end', { reason: 'win', value: score });
    } else {
      enterStage(stage + 1);
    }
  }

  function onStageFailed() {
    screen = 'lose';
    CARTRIDGE.send('end', { reason: 'lose', value: score });
  }

  function beginPlay() {
    if (!started) {
      started = true;
      CARTRIDGE.send('start');
    }
    score = 0;
    CARTRIDGE.send('score', { value: score });
    enterStage(1);
  }

  function backToTitle() {
    screen = 'title';
    boats = [];
    stage = 0;
    score = 0;
  }

  // ---- Update ----
  let lastTime = performance.now();
  function update(dt) {
    if (screen !== 'playing') return;

    // ease beam angle toward target
    const diff = shortestAngleDiff(beamAngle, targetAngle);
    beamAngle += diff * Math.min(1, dt * 6);

    if (stageGoalTimer > 0) stageGoalTimer -= dt;
    if (stageStartMsgTimer > 0) stageStartMsgTimer -= dt;

    const rockRadius = Math.min(W, H) * 0.14;
    const portRadius = Math.min(W, H) * 0.10;

    let allSafe = true;
    for (const boat of boats) {
      if (boat.safe || boat.dead) continue;
      allSafe = false;

      // move boat toward lighthouse slowly (drifting toward rocks)
      const dx = cx - boat.x, dy = cy - boat.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const nx = dx / (dist || 1), ny = dy / (dist || 1);
      boat.bob += dt * 2;

      // Check if boat is lit by beam
      const boatAngle = Math.atan2(boat.y - cy, boat.x - cx);
      const adiff = Math.abs(shortestAngleDiff(beamAngle, boatAngle));
      const isLit = adiff < beamWidth * 0.5 && dist < beamLength;

      if (isLit) {
        boat.lit += dt;
      } else {
        boat.lit = Math.max(0, boat.lit - dt * 0.5);
      }

      if (stageGoalTimer <= 0) {
        if (!isLit) {
          boat.dangerTimer += dt;
        } else {
          boat.dangerTimer = Math.max(0, boat.dangerTimer - dt * 1.5);
        }
      }

      // drift toward rocks always (slowly), guided in when lit enough
      let driftSpeed = boat.speed * 0.4;
      if (boat.lit >= boat.needLight) {
        driftSpeed = boat.speed * 1.4; // guided in fast once "saved"
      }
      boat.x += nx * driftSpeed * 60 * dt * 0.5;
      boat.y += ny * driftSpeed * 60 * dt * 0.5;

      if (boat.lit >= boat.needLight && dist < portRadius) {
        boat.safe = true;
        score += 10;
        CARTRIDGE.send('score', { value: score });
      }

      if (dist < rockRadius && boat.lit < boat.needLight) {
        boat.dead = true;
        onStageFailed();
        return;
      }

      if (stageGoalTimer <= 0 && boat.dangerTimer > boat.rockDelay) {
        boat.dead = true;
        onStageFailed();
        return;
      }
    }

    if (allSafe && boats.length > 0) {
      onGoalMet();
    }
  }

  // ---- Draw ----
  function drawTitle() {
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    drawHalftoneSea();
    drawLighthouseBase();

    ctx.fillStyle = INK1;
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.round(Math.min(W,H)*0.075) + 'px Arial Narrow, Arial, sans-serif';
    ctx.fillText('LE GARDIEN', W/2, H*0.28);
    ctx.fillStyle = INK2;
    ctx.fillText('DU PHARE', W/2 + 2, H*0.28 + Math.round(Math.min(W,H)*0.075) + 4);

    ctx.fillStyle = OVER;
    ctx.font = 'bold ' + Math.round(Math.min(W,H)*0.03) + 'px Arial Narrow, Arial, sans-serif';
    ctx.fillText('Glissez pour tourner le faisceau', W/2, H*0.62);
    ctx.fillText('et guidez les bateaux au port', W/2, H*0.62 + Math.round(Math.min(W,H)*0.045));

    ctx.fillStyle = INK1;
    ctx.font = 'bold ' + Math.round(Math.min(W,H)*0.045) + 'px Arial Narrow, Arial, sans-serif';
    ctx.fillText('TOUCHEZ POUR COMMENCER', W/2, H*0.8);
  }

  function drawHalftoneSea() {
    ctx.save();
    ctx.fillStyle = INK2;
    ctx.globalAlpha = 1;
    const spacing = Math.max(14, Math.min(W,H)*0.03);
    for (let y = H*0.5; y < H; y += spacing) {
      for (let x = 0; x < W; x += spacing) {
        const t = (y - H*0.5) / (H*0.5);
        const r = spacing * 0.15 * (0.3 + t * 0.7);
        ctx.beginPath();
        ctx.arc(x + ((Math.floor(y/spacing)%2)? spacing/2:0), y, r, 0, Math.PI*2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawLighthouseBase() {
    ctx.save();
    ctx.translate(cx, cy);
    // rocks
    ctx.fillStyle = OVER;
    ctx.beginPath();
    const rockR = Math.min(W, H) * 0.14;
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      const rr = rockR * (0.85 + 0.15 * Math.sin(i * 3.1));
      const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();

    // tower
    ctx.fillStyle = INK1;
    const towerW = Math.min(W,H) * 0.09;
    const towerH = Math.min(W,H) * 0.16;
    ctx.fillRect(-towerW/2, -towerH/2, towerW, towerH);
    ctx.fillStyle = INK2;
    ctx.fillRect(-towerW/2+2, -towerH/2+2, towerW, towerH*0.35);
    // top
    ctx.fillStyle = OVER;
    ctx.beginPath();
    ctx.moveTo(-towerW*0.6, -towerH/2);
    ctx.lineTo(towerW*0.6, -towerH/2);
    ctx.lineTo(0, -towerH/2 - towerW*0.7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawBeam() {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(beamAngle);
    const grad = ctx.createLinearGradient(0, 0, beamLength, 0);
    grad.addColorStop(0, 'rgba(255,72,176,0.55)');
    grad.addColorStop(1, 'rgba(255,72,176,0.03)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, beamLength, -beamWidth/2, beamWidth/2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawBoat(boat) {
    ctx.save();
    ctx.translate(boat.x, boat.y + Math.sin(boat.bob) * 2);
    const ang = Math.atan2(cy - boat.y, cx - boat.x);
    ctx.rotate(ang + Math.PI/2);
    const s = Math.min(W,H) * 0.018;
    const litFrac = Math.min(1, boat.lit / boat.needLight);
    ctx.fillStyle = litFrac > 0.99 ? OVER : (litFrac > 0 ? INK2 : INK1);
    ctx.beginPath();
    ctx.moveTo(0, -s*1.4);
    ctx.lineTo(s, s);
    ctx.lineTo(-s, s);
    ctx.closePath();
    ctx.fill();

    // danger flash
    if (boat.dangerTimer > 0) {
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(performance.now()/80);
      ctx.strokeStyle = INK1;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, s*2.2, 0, Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    // light meter above boat
    if (!boat.safe) {
      const barW = s * 3;
      ctx.save();
      ctx.translate(boat.x - barW/2, boat.y - s*3);
      ctx.fillStyle = '#00000022';
      ctx.fillRect(0, 0, barW, 4);
      ctx.fillStyle = INK2;
      ctx.fillRect(0, 0, barW * Math.min(1, boat.lit/boat.needLight), 4);
      ctx.restore();
    }
  }

  function drawPlaying() {
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    drawHalftoneSea();
    drawBeam();
    drawLighthouseBase();

    for (const boat of boats) {
      if (boat.dead) continue;
      drawBoat(boat);
    }

    // HUD
    ctx.textAlign = 'left';
    ctx.fillStyle = INK2;
    ctx.font = 'bold ' + Math.round(Math.min(W,H)*0.035) + 'px Arial Narrow, Arial, sans-serif';
    ctx.fillText('Phase ' + stage, 14, 30);
    ctx.fillStyle = OVER;
    ctx.fillText('Score ' + score, 14, 56);

    if (stageStartMsgTimer > 0) {
      ctx.textAlign = 'center';
      ctx.fillStyle = INK1;
      ctx.font = 'bold ' + Math.round(Math.min(W,H)*0.04) + 'px Arial Narrow, Arial, sans-serif';
      ctx.fillText(stageStartMsg, W/2, H*0.15);
    }

    if (paused) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle = PAPER;
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.round(Math.min(W,H)*0.06) + 'px Arial Narrow, Arial, sans-serif';
      ctx.fillText('PAUSE', W/2, H/2);
    }
  }

  function drawEnd(win) {
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    drawHalftoneSea();
    drawLighthouseBase();

    ctx.textAlign = 'center';
    ctx.fillStyle = win ? INK2 : INK1;
    ctx.font = 'bold ' + Math.round(Math.min(W,H)*0.07) + 'px Arial Narrow, Arial, sans-serif';
    ctx.fillText(win ? 'NUIT SAUVÉE !' : 'NAUFRAGE...', W/2, H*0.4);

    ctx.fillStyle = OVER;
    ctx.font = 'bold ' + Math.round(Math.min(W,H)*0.04) + 'px Arial Narrow, Arial, sans-serif';
    ctx.fillText('Score final : ' + score, W/2, H*0.5);

    ctx.fillStyle = INK1;
    ctx.font = 'bold ' + Math.round(Math.min(W,H)*0.035) + 'px Arial Narrow, Arial, sans-serif';
    ctx.fillText('Touchez pour recommencer', W/2, H*0.65);
  }

  function draw() {
    if (screen === 'title') drawTitle();
    else if (screen === 'playing') drawPlaying();
    else if (screen === 'win') drawEnd(true);
    else if (screen === 'lose') drawEnd(false);
    drawGrain();
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    if (!paused) {
      update(dt);
    }
    draw();
    requestAnimationFrame(loop);
  }

  function layout() {
    resize();
    cx = W / 2;
    cy = H * 0.42;
    beamLength = Math.max(W, H) * 0.75;
  }

  window.addEventListener('resize', layout);

  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || data.source !== 'cartridge-host') return;
    if (data.type === 'pause') paused = true;
    if (data.type === 'resume') paused = false;
    if (data.type === 'reset') backToTitle();
  });

  layout();
  targetAngle = beamAngle = -Math.PI/2;

  CARTRIDGE.send('boot', { title: 'Le Gardien du Phare', gameType: 'stage-clear', lang: 'fr' });

  requestAnimationFrame((t) => { lastTime = t; requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
